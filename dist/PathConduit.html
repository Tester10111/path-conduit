:root{
  --ink:#2f2918;
  --mut:#6d6348;
  --line:#e4d393;
  --accent:#7a5c1c;
  --accent-2:#8d6a1e;
  --paper:#fbf4c4;
  --paper-2:#f3e193;
  --chip:#f4e7ad;
  --ok:#3c6a38;
  --danger:#8a3a2a;
  --new:#7a4a10;
  --new-bg:#f7d56a;
  --shadow:0 18px 40px rgba(70,50,16,.22), 0 2px 4px rgba(70,50,16,.1);
  --focus:0 0 0 3px rgba(122,92,28,.28);
  --titlebar-h:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Figtree",system-ui,sans-serif;
  color:var(--ink);
  background:#c9b27a;
  background-image:
    radial-gradient(rgba(255,255,255,.18) 0.7px, transparent 0.8px),
    linear-gradient(180deg,#d2bc86 0%,#c4ab74 100%);
  background-size:7px 7px, auto;
  min-height:100vh;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:none;box-shadow:var(--focus)}
h1,h2,h3,.brand,.pc{font-family:"Geist Serif",Georgia,serif;font-weight:500}

.desk{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px 24px 48px}
.note{
  position:relative;
  width:420px;max-width:100%;
  height:640px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.28), transparent 28%),
    repeating-linear-gradient(180deg, transparent 0 27px, rgba(122,92,28,.04) 28px),
    linear-gradient(165deg, #fff8d0 0%, #f8ecb0 55%, #f1de92 100%);
  border-radius:3px 3px 8px 8px;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.tape{
  position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2.5deg);
  width:92px;height:22px;z-index:5;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,252,230,.62), rgba(236,214,140,.42));
  border:1px solid rgba(170,140,70,.28);
  box-shadow:0 1px 2px rgba(80,60,20,.12);
}
.fold{
  position:absolute;right:0;bottom:0;width:26px;height:26px;pointer-events:none;z-index:4;
  background:linear-gradient(135deg, transparent 50%, #e6cf7a 50%, #d9be68 100%);
  box-shadow:-2px -2px 4px rgba(80,60,20,.08);
}

.titlebar{
  height:var(--titlebar-h);flex:none;
  display:flex;align-items:center;gap:8px;
  padding:12px 10px 0 16px;
  user-select:none;
}
.titlebar .brand{flex:1;font-size:20px;letter-spacing:-.02em;line-height:1;padding-top:2px}
.win-btns{display:flex;gap:4px;flex:none}
.win-btns button{
  width:28px;height:24px;border:0;background:transparent;border-radius:6px;
  color:var(--mut);font-size:13px;line-height:1;padding:0;
}
.win-btns button:hover{background:rgba(122,92,28,.12);color:var(--ink)}
.win-btns button.close:hover{background:#c4543a;color:#fff}
.win-btns button.pin.on{color:var(--accent);background:rgba(122,92,28,.12)}
html:not(.app) .win-btns .app-only{display:none}

.privacy{
  flex:none;font-size:11px;color:var(--mut);padding:4px 16px 0;
  letter-spacing:.01em;
}

.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 14px 22px}
.scroll{flex:1;min-height:0;overflow:auto;padding-right:2px;scrollbar-width:thin;scrollbar-color:#c9b06a transparent}

h1{font-size:22px;letter-spacing:-.03em;line-height:1.15}
.meta{font-size:12px;color:var(--mut);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:650;padding:3px 8px;border-radius:999px;
  background:var(--chip);border:1px solid var(--line);
}
.chip.new{background:var(--new-bg);border-color:#e0b83f;color:var(--new)}
.chip.warn{background:#f3e0c0;border-color:#e0c48a}

.drop{
  margin-top:12px;border:2px dashed #d7c078;border-radius:12px;
  padding:28px 16px;text-align:center;color:var(--mut);cursor:pointer;
  background:rgba(255,255,255,.22);
}
.drop:hover,.drop.on{background:rgba(255,255,255,.4);border-color:var(--accent)}
.drop .big{display:block;font-family:"Geist Serif",Georgia,serif;font-size:20px;color:var(--ink);margin-bottom:6px}
.drop .hint{font-size:12px}
.drop-actions{margin-top:12px;display:flex;justify-content:center}

button.btn{
  font-size:12px;padding:6px 10px;border-radius:8px;
  border:1px solid #d9c078;background:rgba(255,255,255,.55);line-height:1.2;
}
button.btn:hover{background:rgba(255,255,255,.85)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.primary:hover{background:#63490f;border-color:#63490f}

.toolbar{margin-top:10px;flex:none}
.toolbar .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 100%;position:relative}
.search input{
  width:100%;padding:7px 28px 7px 28px;border-radius:8px;
  border:1px solid #d9c078;background:rgba(255,255,255,.7);
}
.search .ico{position:absolute;left:8px;top:50%;transform:translateY(-50%);opacity:.5;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.menu{position:relative}
.menu-list{
  position:absolute;top:calc(100% + 4px);right:0;min-width:180px;z-index:20;
  background:#fff8d4;border:1px solid #d9c078;border-radius:10px;
  box-shadow:0 8px 20px rgba(70,50,16,.16);padding:4px;
}
.menu-list button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:7px 8px;font-size:12px}
.menu-list button:hover{background:rgba(122,92,28,.1)}

.progwrap{margin-top:8px}
.progbar{height:6px;background:rgba(122,92,28,.12);border-radius:99px;overflow:hidden}
.progbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8d6a1e,#c4a03a);border-radius:99px}
.progmeta{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:11px;color:var(--mut)}

.section-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:12px 0 6px}
.section-hd h2{font-size:15px}
.combo{
  border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.35);margin:0 0 8px;overflow:visible;
  scroll-margin-top:8px;
}
.combo.has-new{box-shadow:inset 3px 0 0 var(--new-bg)}
.combo-hd{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 8px 8px 10px;background:rgba(255,248,210,.8);
  border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;
}
.combo.collapsed .combo-hd{border-bottom:0;border-radius:12px}
.combo.collapsed .ck{display:none}
.foldbtn{width:24px;height:24px;padding:0;border-radius:6px;border:1px solid transparent;background:transparent;flex:none}
.combo-hd .grow{flex:1;min-width:0}
.combo-hd h3{font-size:18px;letter-spacing:-.02em}
.combo-hd .sub{font-size:11px;color:var(--mut)}
.combo-prog{font-size:11px;font-weight:650;color:var(--accent);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.combo.done .combo-prog{color:var(--ok);border-color:#b7d4b0;background:#e7f3e4}

.ck{list-style:none}
.ck li{border-bottom:1px solid var(--line)}
.ck li:last-child{border-bottom:0;border-radius:0 0 12px 12px}
.ck label{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;padding:8px 10px;min-height:40px}
.ck input{width:16px;height:16px;accent-color:var(--accent-2);flex:none}
.ck .pl{flex:1}
.ck li.done .pl{text-decoration:line-through;color:var(--mut)}
.ck small{color:var(--mut);font-size:11px}
.badge{
  font-size:10px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;
  background:var(--new-bg);color:var(--new);border-radius:999px;padding:1px 6px;flex:none;
}
.ck li.has-new{background:rgba(247,213,106,.22)}
.ck li.on label{background:rgba(122,92,28,.08)}
.ck .copy-one{opacity:0;padding:2px 6px;font-size:11px}
.ck li:hover .copy-one,.ck li.on .copy-one{opacity:1}

table.grid{width:100%;border-collapse:collapse;margin-top:2px;font-size:12px}
table.grid th,table.grid td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.grid th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);white-space:nowrap}
table.grid tr[data-jump]{cursor:pointer}
table.grid tr[data-jump]:hover{background:rgba(255,255,255,.5)}
.pc{font-size:16px}
.mini{display:inline-block;padding:1px 6px;margin:1px;border-radius:6px;background:var(--chip);font-size:11px}
.mini.is-new{background:var(--new-bg)}

.banner{margin:8px 0;padding:8px 10px;border-radius:10px;background:#f3e0c0;border:1px solid #e0c48a;font-size:12px}
.banner.err{background:#f8e0d8;border-color:#e8b2a6;color:var(--danger)}

#toast{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%) translateY(6px);
  background:var(--ink);color:#fff8d0;padding:7px 12px;border-radius:10px;
  font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;white-space:nowrap;
}

<body>
<div class="desk">
  <div class="note" role="application" aria-label="Path Conduit">
    <div class="tape" aria-hidden="true"></div>
    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>Path Conduit</div>
      <div class="win-btns">
        <button type="button" id="helpBtn" title="Shortcuts" aria-label="Keyboard shortcuts">?</button>
        <button type="button" class="pin app-only" id="pinBtn" title="Always on top" aria-label="Always on top" aria-pressed="false">📌</button>
        <button type="button" class="app-only" id="minBtn" title="Minimize" aria-label="Minimize">–</button>
        <button type="button" class="close app-only" id="closeBtn" title="Close" aria-label="Close">✕</button>
      </div>

    <div class="body">

        </div>
        <div class="row search">
          <span class="ico" aria-hidden="true">⌕</span>

        </div>

          <button type="button" class="btn" id="openBtn">Open</button>
          <button type="button" class="btn" id="showNewBtn" hidden>Show new only</button>
          <button type="button" class="btn" id="hideDoneBtn">Hide done</button>
          <button type="button" class="btn" id="markSeenBtn" hidden>Mark all as seen</button>
          <button type="button" class="btn" id="clearBtn">Clear</button>
          <div class="menu">
            <button type="button" class="btn" id="exportBtn">Export</button>
            <div class="menu-list" id="exportMenu" hidden>
              <button type="button" id="exportCsv">Download CSV</button>
              <button type="button" id="exportCopy">Copy table</button>
              <button type="button" id="exportPrint">Print</button>
            </div>
          </div>

      <div class="sheet">
        <div class="hd"><h2>Shortcuts</h2><button type="button" class="btn" id="helpClose">Close</button></div>
        <ul>
          <li><span>Open file</span><kbd>O</kbd></li>
          <li><span>Filter</span><kbd>/</kbd></li>
          <li><span>Move</span><span><kbd>J</kbd> <kbd>K</kbd></span></li>
          <li><span>Toggle check</span><kbd>X</kbd></li>
          <li><span>Shortcuts</span><kbd>?</kbd></li>
        </ul>
        <p class="meta" style="margin-top:10px">Nothing is saved. Closing clears everything. CSV and print only run when you ask.</p>
      </div>
    </div>
  </div>
</div>
<input type="file" id="fileInput" accept=".xml,text/xml,application/xml" hidden>
<script>
const RE=/-P(\d+)-(\d+)\.(A\d+)_/;
function extract(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  let ids=[...doc.getElementsByTagName("CableID")].map(n=>n.textContent.trim());
  if(!ids.length) ids=[...text.matchAll(/<CableID>([^<]*)<\/CableID>/g)].map(m=>m[1]);
  const combos=new Map(),unmatched=[];
  for(const id of ids){const m=id.match(RE);if(!m){unmatched.push(id);continue}
    const k=`${+m[1]}-${+m[2]}`;const c=combos.get(k)||{count:0,a:new Map()};c.count++;c.a.set(m[3],(c.a.get(m[3])||0)+1);combos.set(k,c)}
  const num=k=>k.split("-").map(Number);
  const out=[...combos].sort((x,y)=>{const a=num(x[0]),b=num(y[0]);return a[0]-b[0]||a[1]-b[1]})
    .map(([k,c])=>({pc:k,records:c.count,a0x:[...c.a].sort().map(([a,n])=>({a,n}))}));
  return {records:ids.length,combos:out,unmatched};
}

/* Path Conduit — session memory only. No localStorage, sessionStorage, IndexedDB, or file writes. */

const IS_TAURI = typeof window !== "undefined" && !!(window.__TAURI_INTERNALS__ || window.__TAURI__);
const COLS = ["Path-Conduit","Records","A0X","A0X records"];
const state = {
  files: [],
  active: 0,
  hideDone: false,
  showNewOnly: false,
  query: "",
  cursor: null,
  exportOpen: false,
  seen: new Set(),
  lastKeys: new Set(),
  lastLoadAt: null,
  lastName: "",
  checks: Object.create(null),
  folds: Object.create(null),
  firstLoad: true,
};

function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return [...(r||document).querySelectorAll(s)]; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function cid(pc, a){ return pc + "|" + a; }
function fmtTime(d){
  return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

/* Record identity: CableID + TAB + DateTime.
   CableID is not unique (retests appear as extra rows). FileName is also unique
   on typical LinkWare exports, but CableID + DateTime is the documented key.
   Path, conduit, and A0X are parsed from CableID with the same RE as extract(). */
function recordKey(cableId, dateTime, fileName){
  return String(cableId || "") + "\t" + String(dateTime || fileName || "");
}

function indexRecords(text){
  const doc = new DOMParser().parseFromString(text, "application/xml");
  let nodes = [...doc.getElementsByTagName("TestSummary")];
  if(!nodes.length) nodes = [...doc.getElementsByTagName("testsummary")];
  const recs = [];
  if(nodes.length){
    for(const n of nodes){
      const val = tag => (n.getElementsByTagName(tag)[0]?.textContent || "").trim();
      const cableId = val("CableID");
      const dateTime = val("DateTime");
      const fileName = val("FileName");
      const key = recordKey(cableId, dateTime, fileName);
      const m = cableId.match(RE);
      recs.push({
        key, cableId, dateTime, fileName,
        pc: m ? `${+m[1]}-${+m[2]}` : "",
        a: m ? m[3] : "",
      });
    }
    return recs;
  }
  let ids = [...doc.getElementsByTagName("CableID")].map(n => n.textContent.trim());
  if(!ids.length) ids = [...text.matchAll(/<CableID>([^<]*)<\/CableID>/g)].map(m => m[1]);
  ids.forEach((cableId, i) => {
    const m = cableId.match(RE);
    recs.push({
      key: recordKey(cableId, "", "row-" + i),
      cableId, dateTime: "", fileName: "row-" + i,
      pc: m ? `${+m[1]}-${+m[2]}` : "",
      a: m ? m[3] : "",
    });
  });
  return recs;
}

function toast(msg){
  const el = $("#toast");
  if(!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1800);
}

function typingInField(){
  const a = document.activeElement;
  if(!a) return false;
  const tag = (a.tagName || "").toLowerCase();
  if(tag === "textarea" || tag === "select") return true;
  if(tag === "input"){
    const t = (a.type || "text").toLowerCase();
    return t !== "checkbox" && t !== "radio" && t !== "button" && t !== "submit";
  }
  return a.isContentEditable;
}

function current(){ return state.files[state.active] || null; }

function itemChecked(pc, a){ return !!state.checks[cid(pc, a)]; }
function setChecked(pc, a, on){
  const k = cid(pc, a);
  if(on) state.checks[k] = true;
  else delete state.checks[k];
}

function comboDone(c){ return c.a0x.length > 0 && c.a0x.every(x => itemChecked(c.pc, x.a)); }
function doneCount(file){
  if(!file) return 0;
  return file.r.combos.reduce((n, c) => n + c.a0x.filter(x => itemChecked(c.pc, x.a)).length, 0);
}
function totalItems(file){
  if(!file) return 0;
  return file.r.combos.reduce((n, c) => n + c.a0x.length, 0);
}

function summarizeNew(file){
  if(!file) return { newCount: 0, removed: 0, newKeys: new Set(), newCombos: new Set(), newA0x: new Set() };
  const newKeys = new Set();
  for(const rec of file.recs){
    if(!state.seen.has(rec.key)) newKeys.add(rec.key);
  }
  const removed = file.removed || 0;
  const newCombos = new Set();
  const newA0x = new Set();
  const counts = Object.create(null);
  for(const rec of file.recs){
    if(!newKeys.has(rec.key) || !rec.pc) continue;
    counts[cid(rec.pc, rec.a)] = (counts[cid(rec.pc, rec.a)] || 0) + 1;
    newCombos.add(rec.pc);
    newA0x.add(cid(rec.pc, rec.a));
  }
  return { newCount: newKeys.size, removed, newKeys, newCombos, newA0x, counts };
}

function ingestFile(name, text){
  const r = extract(text);
  const recs = indexRecords(text);
  const keySet = new Set(recs.map(x => x.key));
  const file = { name, text, r, recs, keySet, loadedAt: new Date() };
  if(state.firstLoad || !state.files.length){
    state.seen = new Set(keySet);
    state.firstLoad = false;
    file.baseline = true;
    file.removed = 0;
  } else {
    file.baseline = false;
    let removed = 0;
    for(const k of state.lastKeys){ if(!keySet.has(k)) removed++; }
    file.removed = removed;
  }
  state.lastKeys = keySet;
  state.lastLoadAt = file.loadedAt;
  state.lastName = name;
  const existing = state.files.findIndex(f => f.name === name);
  if(existing >= 0) state.files[existing] = file;
  else state.files.push(file);
  state.active = existing >= 0 ? existing : state.files.length - 1;
  return file;
}

function clearSession(){
  state.files = [];
  state.active = 0;
  state.seen = new Set();
  state.lastKeys = new Set();
  state.lastLoadAt = null;
  state.lastName = "";
  state.checks = Object.create(null);
  state.folds = Object.create(null);
  state.firstLoad = true;
  state.query = "";
  state.showNewOnly = false;
  state.cursor = null;
  const inp = $("#q");
  if(inp) inp.value = "";
}

function markAllSeen(){
  const f = current();
  if(!f) return 0;
  let n = 0;
  for(const k of f.keySet){
    if(!state.seen.has(k)){ state.seen.add(k); n++; }
  }
  return n;
}

async function readFile(file){
  const text = await file.text();
  ingestFile(file.name, text);
  render();
}

function csvEscape(v){ return /[",\n]/.test(v) ? "\"" + v.replace(/"/g, "\"\"") + "\"" : v; }
function toCSV(file){
  const rows = [COLS.join(",")];
  for(const c of file.r.combos){
    const a = c.a0x.map(x => x.a).join(" ");
    const n = c.a0x.map(x => String(x.n)).join(" ");
    rows.push([c.pc, String(c.records), a, n].map(csvEscape).join(","));
  }
  return rows.join("\n") + "\n";
}
function downloadCSV(){
  const f = current();
  if(!f) return;
  const blob = new Blob([toCSV(f)], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (f.name.replace(/\.xml$/i, "") || "path-conduit") + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("CSV saved");
}

function copyText(s){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(s).then(() => true).catch(() => fallbackCopy(s));
  }
  return Promise.resolve(fallbackCopy(s));
}
function fallbackCopy(s){
  const ta = document.createElement("textarea");
  ta.value = s; document.body.appendChild(ta); ta.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(_){}
  ta.remove();
  return ok;
}

function exportTSV(){
  const f = current();
  if(!f) return;
  const lines = [COLS.join("\t")];
  for(const c of f.r.combos){
    lines.push([c.pc, c.records, c.a0x.map(x => x.a).join(" "), c.a0x.map(x => x.n).join(" ")].join("\t"));
  }
  copyText(lines.join("\n")).then(ok => toast(ok ? "Copied table" : "Copy failed"));
}

function renderEmpty(){
  $("#workspace").innerHTML = `
    <div class="drop" id="dropzone" tabindex="0" role="button" aria-label="Open an XML file">
      <span class="big">Drop a Fluke XML here</span>
      <span class="hint">or click Open. Fully offline.</span>
      <div class="drop-actions"><button type="button" class="btn primary" id="openBtnEmpty">Open file</button></div>
    </div>`;
  bindDrop($("#dropzone"));
  $("#openBtnEmpty")?.addEventListener("click", e => { e.stopPropagation(); openPicker(); });
}

function render(){
  const f = current();
  const body = $("#workspace");
  if(!f){ renderEmpty(); updateChrome(); return; }
  const q = state.query.trim().toLowerCase();
  const info = summarizeNew(f);
  const done = doneCount(f), tot = totalItems(f);
  const pct = tot ? Math.round(done / tot * 100) : 0;
  const when = state.lastLoadAt ? fmtTime(state.lastLoadAt) : "";
  const newChip = f.baseline
    ? `<span class="chip">Baseline · ${f.r.records.toLocaleString()} records</span>`
    : (info.newCount
        ? `<span class="chip new">New since ${when}: ${info.newCount.toLocaleString()}</span>`
        : `<span class="chip">No new records since ${when}</span>`);
  const remChip = (!f.baseline && info.removed) ? `<span class="chip warn">Removed: ${info.removed.toLocaleString()}</span>` : "";
  const unmatched = f.r.unmatched.length
    ? `<div class="banner">Unmatched CableIDs: ${f.r.unmatched.length.toLocaleString()}</div>` : "";

  let table = `<div class="section-hd"><h2>Combos</h2><span class="meta">${f.r.combos.length} groups</span></div>
    <table class="grid"><thead><tr><th>Path-Conduit</th><th>Records</th><th>A0X</th></tr></thead><tbody>`;
  for(const c of f.r.combos){
    const isNew = info.newCombos.has(c.pc);
    const ahtml = c.a0x.map(x => {
      const n = info.counts[cid(c.pc, x.a)] || 0;
      return `<span class="mini${n ? " is-new" : ""}">${esc(x.a)} ${x.n}${n ? ` · ${n} new` : ""}</span>`;
    }).join(" ");
    table += `<tr data-jump="${esc(c.pc)}"><td class="pc">${esc(c.pc)}${isNew ? ` <span class="badge">New</span>` : ""}</td><td>${c.records}</td><td>${ahtml}</td></tr>`;
  }
  table += `</tbody></table>`;

  let lists = `<div class="section-hd"><h2>Checklist</h2><span class="meta">${done} / ${tot} done</span></div>`;
  for(const c of f.r.combos){
    const folded = !!state.folds[c.pc];
    const isNewC = info.newCombos.has(c.pc);
    const newInC = c.a0x.reduce((n, x) => n + (info.counts[cid(c.pc, x.a)] || 0), 0);
    const cd = comboDone(c);
    const qHit = !q || c.pc.toLowerCase().includes(q) || c.a0x.some(x => x.a.toLowerCase().includes(q));
    const cls = ["combo", folded ? "collapsed" : "", isNewC || newInC ? "has-new" : "", cd ? "done" : "", qHit ? "" : "filtered-out"].filter(Boolean).join(" ");
    lists += `<section class="${cls}" data-pc="${esc(c.pc)}" id="combo-${esc(c.pc)}">
      <div class="combo-hd">
        <button type="button" class="foldbtn" data-fold="${esc(c.pc)}" aria-label="Fold ${esc(c.pc)}">${folded ? "▸" : "▾"}</button>
        <div class="grow"><h3>${esc(c.pc)}${isNewC ? ` <span class="badge">New</span>` : ""}</h3>
          <div class="sub">${c.records.toLocaleString()} records${newInC ? ` · ${newInC} new` : ""}</div></div>
        <span class="combo-prog">${c.a0x.filter(x => itemChecked(c.pc, x.a)).length}/${c.a0x.length}</span>
      </div>`;
    if(!folded){
      lists += `<ul class="ck">`;
      for(const x of c.a0x){
        const id = cid(c.pc, x.a);
        const on = itemChecked(c.pc, x.a);
        const nNew = info.counts[id] || 0;
        const hit = !q || c.pc.toLowerCase().includes(q) || x.a.toLowerCase().includes(q);
        const cur = state.cursor === id ? "on" : "";
        lists += `<li class="${[on?"done":"", nNew?"has-new":"", cur, hit?"":"filtered-out"].filter(Boolean).join(" ")}" data-id="${esc(id)}">
          <label><input type="checkbox" data-check="${esc(id)}" ${on?"checked":""}>
            <span class="pl">${esc(x.a)} <small>${x.n} record${x.n===1?"":"s"}</small></span>
            ${nNew ? `<span class="badge">New ${nNew}</span>` : ""}
            <button type="button" class="btn copy-one" data-copy="${esc(c.pc)} ${esc(x.a)}">Copy</button>
          </label>
        </li>`;
      }
      lists += `</ul>`;
    }
    lists += `</section>`;
  }

  body.innerHTML = `
    <div class="chips">
      <span class="chip">${esc(f.name)}</span>
      <span class="chip">${f.r.records.toLocaleString()} records</span>
      ${newChip}${remChip}
    </div>
    <div class="progwrap"><div class="progbar"><i style="width:${pct}%"></i></div>
      <div class="progmeta"><span>${done} of ${tot} A0X checked</span><span>${pct}%</span></div></div>
    ${unmatched}
    ${table}
    ${lists}`;
  updateChrome();
}

function updateChrome(){
  const f = current();
  const tb = $("#toolbar");
  if(!f){ tb.hidden = true; document.body.classList.remove("hide-done","show-new"); return; }
  tb.hidden = false;
  document.body.classList.toggle("hide-done", state.hideDone);
  document.body.classList.toggle("show-new", state.showNewOnly);
  $("#hideDoneBtn").classList.toggle("primary", state.hideDone);
  $("#showNewBtn").classList.toggle("primary", state.showNewOnly);
  $("#showNewBtn").hidden = f.baseline || summarizeNew(f).newCount === 0;
  $("#markSeenBtn").hidden = f.baseline || summarizeNew(f).newCount === 0;
  $("#fileLabel").textContent = f.name;
}

function bindDrop(el){
  if(!el || el._bound) return;
  el._bound = true;
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("on"); });
  el.addEventListener("dragleave", () => el.classList.remove("on"));
  el.addEventListener("drop", e => {
    e.preventDefault(); el.classList.remove("on");
    const file = [...(e.dataTransfer?.files || [])].find(f => /\.xml$/i.test(f.name) || f.type.includes("xml")) || e.dataTransfer?.files?.[0];
    if(file) readFile(file);
  });
  el.addEventListener("click", () => openPicker());
  el.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " ") { e.preventDefault(); openPicker(); } });
}

function openPicker(){ $("#fileInput").click(); }

function visibleItems(){
  return $$(".ck li").filter(li => li.offsetParent !== null);
}
function moveCursor(dir){
  const items = visibleItems();
  if(!items.length) return;
  let i = items.findIndex(li => li.dataset.id === state.cursor);
  i = i < 0 ? (dir > 0 ? 0 : items.length - 1) : Math.max(0, Math.min(items.length - 1, i + dir));
  state.cursor = items[i].dataset.id;
  $$(".ck li").forEach(li => li.classList.toggle("on", li.dataset.id === state.cursor));
  items[i].scrollIntoView({ block: "nearest" });
}
function toggleCursor(){
  if(!state.cursor) { moveCursor(1); if(!state.cursor) return; }
  const [pc, a] = state.cursor.split("|");
  setChecked(pc, a, !itemChecked(pc, a));
  render();
}

function confirmUncheckAll(){
  if(!current()) return;
  if(!window.confirm("Uncheck every A0X in this file?")) return;
  state.checks = Object.create(null);
  render();
  toast("All unchecked");
}

function initApp(){
  if(IS_TAURI) document.documentElement.classList.add("app");

  $("#openBtn").addEventListener("click", openPicker);
  $("#fileInput").addEventListener("change", e => {
    const file = e.target.files && e.target.files[0];
    if(file) readFile(file);
    e.target.value = "";
  });
  $("#q").addEventListener("input", e => { state.query = e.target.value; render(); });
  $("#hideDoneBtn").addEventListener("click", () => { state.hideDone = !state.hideDone; updateChrome(); });
  $("#showNewBtn").addEventListener("click", () => { state.showNewOnly = !state.showNewOnly; updateChrome(); });
  $("#markSeenBtn").addEventListener("click", () => {
    const n = markAllSeen();
    state.showNewOnly = false;
    render();
    toast(n ? `Marked ${n} as seen` : "Already seen");
  });
  $("#clearBtn").addEventListener("click", () => {
    if(!window.confirm("Clear this session? The file, checkmarks, and seen records will be forgotten.")) return;
    clearSession();
    render();
    toast("Session cleared");
  });
  $("#exportBtn").addEventListener("click", e => {
    e.stopPropagation();
    state.exportOpen = !state.exportOpen;
    $("#exportMenu").hidden = !state.exportOpen;
  });
  $("#exportCsv").addEventListener("click", () => { state.exportOpen = false; $("#exportMenu").hidden = true; downloadCSV(); });
  $("#exportCopy").addEventListener("click", () => { state.exportOpen = false; $("#exportMenu").hidden = true; exportTSV(); });
  $("#exportPrint").addEventListener("click", () => { state.exportOpen = false; $("#exportMenu").hidden = true; window.print(); });
  $("#helpBtn").addEventListener("click", () => $("#help").classList.add("on"));
  $("#helpClose").addEventListener("click", () => $("#help").classList.remove("on"));
  $("#help").addEventListener("click", e => { if(e.target.id === "help") $("#help").classList.remove("on"); });

  document.addEventListener("click", e => {
    if(state.exportOpen && !e.target.closest(".menu")){
      state.exportOpen = false;
      $("#exportMenu").hidden = true;
    }
  });

  $("#workspace").addEventListener("change", e => {
    const id = e.target.getAttribute("data-check");
    if(!id) return;
    const [pc, a] = id.split("|");
    setChecked(pc, a, e.target.checked);
    render();
  });
  $("#workspace").addEventListener("click", e => {
    const fold = e.target.closest("[data-fold]");
    if(fold){
      const pc = fold.getAttribute("data-fold");
      state.folds[pc] = !state.folds[pc];
      render();
      return;
    }
    const copy = e.target.closest("[data-copy]");
    if(copy){
      e.preventDefault();
      copyText(copy.getAttribute("data-copy")).then(ok => toast(ok ? "Copied" : "Copy failed"));
      return;
    }
    const jump = e.target.closest("[data-jump]");
    if(jump){
      const el = document.getElementById("combo-" + jump.getAttribute("data-jump"));
      el?.scrollIntoView({ block: "start" });
    }
  });

  document.addEventListener("keydown", e => {
    if(e.key === "Escape"){
      $("#help").classList.remove("on");
      state.exportOpen = false;
      $("#exportMenu").hidden = true;
      return;
    }
    if(e.key === "?" && !typingInField()){ e.preventDefault(); $("#help").classList.toggle("on"); return; }
    if(e.key === "/" && !typingInField()){ e.preventDefault(); $("#q").focus(); return; }
    if(typingInField()) return;
    if(e.key === "o" && !e.metaKey && !e.ctrlKey){ e.preventDefault(); openPicker(); }
    if(e.key === "j") moveCursor(1);
    if(e.key === "k") moveCursor(-1);
    if(e.key === "x" || e.key === " ") { e.preventDefault(); toggleCursor(); }
  });

  document.addEventListener("dragover", e => { e.preventDefault(); $("#overlay").classList.add("on"); });
  document.addEventListener("dragleave", e => { if(e.target === document.documentElement || e.relatedTarget === null) $("#overlay").classList.remove("on"); });
  document.addEventListener("drop", e => {
    e.preventDefault();
    $("#overlay").classList.remove("on");
    const file = [...(e.dataTransfer?.files || [])].find(f => /\.xml$/i.test(f.name) || f.type.includes("xml")) || e.dataTransfer?.files?.[0];
    if(file) readFile(file);
  });

  bindTitlebar();
  render();
}

function bindTitlebar(){
  const pin = $("#pinBtn"), min = $("#minBtn"), close = $("#closeBtn");
  if(!IS_TAURI){
    pin?.addEventListener("click", () => toast("Pin is available in the desktop app"));
    return;
  }
  const getWin = async () => {
    const w = window.__TAURI__ && window.__TAURI__.window;
    if(w && w.getCurrentWindow) return w.getCurrentWindow();
    if(w && w.getCurrent) return w.getCurrent();
    return null;
  };
  pin?.addEventListener("click", async () => {
    try{
      const win = await getWin();
      if(!win) return;
      const on = await win.isAlwaysOnTop();
      await win.setAlwaysOnTop(!on);
      pin.classList.toggle("on", !on);
      pin.setAttribute("aria-pressed", String(!on));
    }catch(err){ toast("Could not pin"); }
  });
  min?.addEventListener("click", async () => { try{ (await getWin())?.minimize(); }catch(_){ } });
  close?.addEventListener("click", async () => { try{ (await getWin())?.close(); }catch(_){ window.close(); } });
}

if(typeof document !== "undefined"){
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", initApp);
  else initApp();
}

if(typeof module !== "undefined"){
  module.exports = { extract, indexRecords, recordKey, RE, ingestFile, clearSession, markAllSeen, summarizeNew, state, toCSV, COLS };
}

</script>
