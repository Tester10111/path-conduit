[package]
name = "path-conduit"
version = "1.0.0"
description = "Path Conduit — offline Fluke XML Path-Conduit extractor"
authors = ["Bao Do"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "path_conduit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
